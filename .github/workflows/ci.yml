name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pii-guard:
    name: PII guard (generic backstop)
    runs-on: ubuntu-latest
    env:
      # Known-clean floor for the unusable-base fallback: the commit that removed
      # the initial scaffold's demo files from personal-data paths. Without it, a
      # full-history fallback scan (force-push / branch creation) is guaranteed-red
      # on those permanent legacy commits, burying any real signal.
      PII_GUARD_BASELINE: 4381499cb1d7bcc50585538ef2f679f90d00d14b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the guard diffs against the PR base / push `before` sha
      # Tripwire HERE, not only in pytest: the backend job's shallow checkout always
      # skips the pytest version, and a fresh full clone is exactly where a
      # post-history-rewrite stale baseline would first stop resolving.
      - name: Baseline sha still resolves
        run: git cat-file -e "${PII_GUARD_BASELINE}^{commit}" || { echo "::error::PII_GUARD_BASELINE no longer resolves — update ci.yml after the history rewrite"; exit 1; }
      # Generic subset only (personal paths + emails) — the personal-term denylist
      # stays local by design; see scripts/ci_pii_guard.sh for the threat model.
      - name: Scan pushed diff for personal paths / real emails
        run: bash scripts/ci_pii_guard.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

  compose-validate:
    name: docker-compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Interpolation/structure check for the compose file (user: directive, mounts,
      # env defaults) — the data-loss class its mounts fix has no other CI floor.
      - name: Validate compose file
        run: cp .env.example .env && docker compose config -q

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r api/requirements.txt pytest
      - name: Run pytest
        working-directory: api
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: web
        # `ci`, not `install`: it installs exactly the locked tree and fails if the
        # lockfile and package.json disagree, so CI can't quietly build something a
        # contributor's machine won't reproduce.
        run: npm ci
      - name: Build (tsc + vite)
        working-directory: web
        run: npm run build

  demo-smoke:
    name: Demo dataset smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r api/requirements.txt
      - name: Seed every persona and smoke-test the API
        working-directory: api
        env:
          PYTHONPATH: ${{ github.workspace }}/api
        run: |
          for p in ai-engineer ux-designer chem-phd bio-scientist law-student; do
            python ../scripts/demo_smoke.py "$p"
          done
