services:
  api:
    build: ./api
    container_name: peregrine-api
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./.agents:/app/.agents
      - ./logs:/app/logs
      # Persist datasets (PEREGRINE_DATASET) on the host — incl. a private, gitignored
      # local test profile under .demo/<name>/. Code personas re-seed from code.
      - ./.demo:/app/.demo
      # Live source: API code changes (e.g. after a git pull) reflect on the next
      # request via --reload, so the container never serves a stale schema/route.
      - ./api/app:/app/app
      # The in-app User Manual (docs/manual/), served read-only by /api/docs -> web /docs.
      - ./docs:/app/docs:ro
    # uvicorn's reloader only restarts on *.py changes, so the app's runtime writes to
    # the mounted data/config/logs (csv/md/yml/json/log) never trigger a reload — only
    # editing the Python source does. (Verified with file-write probes.)
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # Empty -> frontend calls relative /api and nginx proxies to the api service.
        VITE_API_BASE: ${VITE_API_BASE:-}
        # Empty -> "Internal (Claude)" terminal uses http://localhost:7681 (default
        # ttyd port from scripts/terminal.sh). Override only if you change the port.
        VITE_TERMINAL_URL: ${VITE_TERMINAL_URL:-}
    container_name: peregrine-web
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
