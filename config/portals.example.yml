# ---------------------------------------------------------------------------
# Scraper configuration. Copy to `config/portals.yml`.
# Generic, ATS-feed based (inspired by santifer/career-ops). Each company entry
# names the ATS provider + the company's slug on that ATS.
# ---------------------------------------------------------------------------

# Free-text search queries run across supported job boards.
queries:
  - "machine learning engineer"
  - "applied scientist"

# Per-company direct ATS feeds (most reliable, no scraping HTML). Each hits the
# board's own public API/feed (host-pinned + rate-limited via crawl_policy).
# provider: greenhouse | ashby | lever | recruitee | smartrecruiters | workable | generic
# `slug` is the company's handle on that ATS — read it from the careers URL, e.g.:
#   recruitee       <slug>.recruitee.com                  -> slug: channable
#   smartrecruiters careers.smartrecruiters.com/<slug>    -> slug: adyen
#   workable        apply.workable.com/<slug>             -> slug: huggingface
companies:
  - name: Anthropic
    provider: greenhouse
    slug: anthropic
  - name: OpenAI
    provider: ashby
    slug: openai

# Hard filters applied during scan.
filters:
  locations: []                 # empty = any
  remote_only: false
  min_base: 0                   # 0 = no salary floor

# Be a polite scraper.
rate_limit_seconds: 2
snapshot: true                  # save raw posting to data/jobs/<id>.md
